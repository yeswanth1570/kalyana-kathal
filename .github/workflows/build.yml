name: Build and deploy Godot game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Validate project scripts
        run: godot --headless --editor --path . --quit

      - name: Import and validate Life Quest
        run: godot --headless --editor --path games/life-quest --quit

      - name: Test Qwen game API and browser chat syntax
        run: |
          python3 -m unittest discover -s games/life-quest/backend/tests -v
          node --check games/life-quest/web/chat.js
          node --test games/life-quest/tests/chat.test.cjs

      - name: Test Life Quest gameplay and all five acts
        run: |
          set -o pipefail
          godot --headless --path games/life-quest --script res://tests/gameplay.gd 2>&1 | tee life-quest-tests.log
          godot --headless --path games/life-quest --script res://tests/art.gd 2>&1 | tee -a life-quest-tests.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' life-quest-tests.log; then exit 1; fi

      - name: Export browser build
        run: mkdir -p build/web && godot --headless --path . --export-release "Web" build/web/index.html

      - name: Export the school chapter preview and the stable game
        run: |
          export_life_quest() {
            local source="$1" destination="$2" executable="$3"
            mkdir -p "$destination"
            godot --headless --path "$source" --export-release Web "$destination/$executable.html"
            cp "$destination/$executable.html" "$destination/index.html"
            cp "$source/web/chat.js" "$source/web/chat.css" "$source/art/cover-v2.png" "$destination/"
            cp "$source/fonts/CinzelDecorative-Bold.ttf" "$source/fonts/CinzelDecorative-OFL.txt" "$destination/"
          }
          export_life_quest games/life-quest "$PWD/build/web/life-quest-preview" game-v9
          # Keep the public stable game on its last tested release until device sign-off.
          git worktree add --detach "$RUNNER_TEMP/kalyana-stable" 7561aca9e89f622e60423fb49e42ae62ef1ce355
          stable="$RUNNER_TEMP/kalyana-stable/games/life-quest"
          godot --headless --editor --path "$stable" --quit
          export_life_quest "$stable" "$PWD/build/web/life-quest" game-v5

      - name: Verify exported games
        run: |
          test -s build/web/index.html
          test -s build/web/life-quest/index.html
          test -s build/web/life-quest/chat.js
          test -s build/web/life-quest/chat.css
          test -s build/web/life-quest-preview/game-v9.pck
          test -s build/web/life-quest-preview/game-v9.wasm
          test -s build/web/life-quest/game-v5.pck
          test -s build/web/life-quest-preview/index.html
          if grep -q '\$GODOT_' build/web/life-quest*/index.html; then exit 1; fi
          if find build/web -iname '*pilot*' -o -iname '*.sqlite' | grep -q .; then exit 1; fi
          touch build/web/.nojekyll

      - name: Export Windows build
        run: mkdir -p build/windows && godot --headless --path . --export-release "Windows Desktop" build/windows/KalyanaKathal.exe

      - name: Package Windows build
        run: cd build/windows && zip -q ../KalyanaKathal-Windows.zip KalyanaKathal.exe

      - name: Upload browser build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KalyanaKathal-Web
          path: build/web/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web/

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: KalyanaKathal-Windows
          path: build/KalyanaKathal-Windows.zip
          if-no-files-found: error
          retention-days: 30
